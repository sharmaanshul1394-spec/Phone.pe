<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,
maximum-scale=1.0,user-scalable=no">

<title>Payment Demo</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8c20dc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#f7b6ff,#f5d7ff);
min-height:100vh;
color:#35105d;
}

.header{
padding:25px 15px 15px;
text-align:center;
}

.header h1{
color:#fff;
font-size:34px;
text-shadow:0 2px 5px #9b35c9;
}

.header p{
margin-top:5px;
color:#6e278f;
}

.container{
padding:15px;
max-width:650px;
margin:auto;
}

/* HOME */

.cards{
display:flex;
gap:12px;
justify-content:center;
align-items:stretch;
}

.card{
width:50%;
background:#fff;
border:1px solid #dba8eb;
border-radius:15px;
padding:13px 8px;
text-align:center;
box-shadow:0 5px 15px rgba(100,0,130,.15);
}

.card h3{
font-size:15px;
line-height:20px;
}

.price{
background:linear-gradient(90deg,#7b16db,#b124e8);
color:white;
font-size:25px;
font-weight:bold;
margin:10px -8px;
padding:8px;
transform:skew(-8deg);
}

.features{
text-align:left;
font-size:11px;
line-height:22px;
padding:5px;
}

.buy{
border:0;
background:#8b20db;
color:white;
padding:9px 17px;
border-radius:20px;
font-weight:bold;
cursor:pointer;
}

.buttons{
display:flex;
gap:12px;
margin-top:35px;
}

.bigbtn{
flex:1;
border:0;
padding:14px 5px;
border-radius:25px;
background:#8d20dc;
color:white;
font-weight:bold;
}

/* PAYMENT */

#paymentPage{
display:none;
}

.paymentBox{
background:#fff7ff;
border-radius:18px;
padding:20px 15px;
box-shadow:0 5px 20px rgba(80,0,100,.15);
}

.back{
background:none;
border:0;
font-size:18px;
color:#602080;
margin-bottom:15px;
cursor:pointer;
}

.paymentTop{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.paymentTitle{
font-size:20px;
font-weight:bold;
}

.amount{
text-align:right;
}

.amount small{
display:block;
font-size:13px;
}

.amount strong{
font-size:27px;
}

.order{
font-size:13px;
color:#633b76;
margin:15px 0;
word-break:break-all;
}

.demo{
text-align:center;
color:#8b20db;
font-size:12px;
font-weight:bold;
margin-bottom:8px;
}

.qr{
width:260px;
height:260px;
background:white;
border:1px solid #ddd;
border-radius:12px;
padding:10px;
display:block;
margin:10px auto 18px;
object-fit
